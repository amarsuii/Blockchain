{% extends "base.html" %}

{% block title %}Login - Certificate Verification System{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="card-header bg-dark-indigo text-white text-center py-4">
                    <div class="brand-icon mx-auto mb-2 bg-primary text-white rounded-circle d-flex align-items-center justify-content-center" style="width: 48px; height: 48px;">
                        <i class="bi bi-person-lock fs-4"></i>
                    </div>
                    <h4 class="fw-bold mb-1">Account Login</h4>
                    <p class="text-white-50 small mb-0">Authorized Administrator & Student Access</p>
                </div>

                <div class="card-body p-4 p-md-5 bg-white">
                    <form action="{{ url_for('auth.login') }}" method="POST">
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" id="email" name="email" value="{{ email if email else '' }}" placeholder="name@certverify.org" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                                <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100 rounded-3 mb-3">
                            <i class="bi bi-box-arrow-in-right me-2"></i> Sign In
                        </button>
                    </form>

                    <!-- Demo Credentials Helper -->
                    <div class="mt-4 p-3 bg-light rounded-3 border border-dashed">
                        <h6 class="fw-bold text-dark mb-2 small"><i class="bi bi-info-circle text-primary me-1"></i> Demo Credentials:</h6>
                        <div class="d-flex flex-column gap-1 small text-secondary">
                            <div><strong>Admin:</strong> <code>admin@certverify.org</code> / <code>admin123</code></div>
                            <div><strong>Student:</strong> <code>student@certverify.org</code> / <code>student123</code></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
